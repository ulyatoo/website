<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel</title>
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js"></script>
</head>

<body>
    <div class="all">

        <main>
            <section id="" class="main_sect">
                <div class="main_container">
                    <h1>Пиксель</h1>
                    <h2>Создавай свои картинки</h2>
                    <p>Работай прямо в браузере!</p>
                    <a href="" class="btn">Перейти к редактору</a>
                </div>
            </section>

            <section id="" class="func_sect">
                <div class="func_container">
                    <h2 class="func_text">На платформе можно:</h2>
                </div>
                <div class="func_cards">
                    <div class="card">
                        <p class="card_num">1</p>
                        <h3 class="card_text">Выбрать цвет для изображения</h3>
                    </div>
                    <div class="card">
                        <p class="card_num">2</p>
                        <h3 class="card_text">Закрашивать пиксели с помощью мыши</h3>
                    </div>
                    <div class="card">
                        <p class="card_num">3</p>
                        <h3 class="card_text">Сохранять получившийся рисунок</h3>
                    </div>
                    <div class="card">
                        <p class="card_num">4</p>
                        <h3 class="card_text">Скачивать итоговый результат</h3>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <container class="main-container">
        <div class="field-container">
            <div class="color-palette">
                <div class="color-cell red selected"></div>
                <div class="color-cell green"></div>
                <div class="color-cell blue"></div>
                <div class="color-cell yellow"></div>
                <div class="color-cell skyblue"></div>
                <div class="tool-cell eraser">
                    <img src="https://avatars.mds.yandex.net/i?id=8122c98f0bfd7558e07763812a6d769f0c990f2a-5232166-images-thumbs&n=13" alt="" width="20px" height="20px">
                </div>
                <div class="tool-cell fill-tool">
                    <img src="https://avatars.mds.yandex.net/i?id=52065dd993f218baf68286ce2441930b55bef31d-8185027-images-thumbs&n=13" alt="" width="20px" height="20px">
                </div>
                <div class="tool-cell save">
                    <img src="https://avatars.mds.yandex.net/i?id=9652d8f0a12c40b0f0c2ce74250d31b6fcee4586-10018787-images-thumbs&n=13" alt="" width="20px" height="20px">
                </div>
            </div>
            <div class="field"></div>
        </div>
    </container>

</body>

</html>
